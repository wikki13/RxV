services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["7860:7860"]
    env_file: .env
    environment:
      RXV_RUNNER_URL: http://runner:8081
      RXV_CALLBACK_BASE_URL: http://api:7860
    volumes:
      - rxv-data:/data
  golem:
    build: .
    ports: ["7860:7860"]
    environment:
      RXV_API_URL: http://api:7860
    depends_on: [api]
  runner:
    build: ./runner
    environment:
      RXV_RUNNER_TOKEN: ${RXV_RUNNER_TOKEN}
      RXV_CALLBACK_BASE_URL: http://api:7860
      RXV_UPLOAD_ROOT: /data/uploads
      RXV_REPORT_ROOT: /data/reports
    volumes:
      - rxv-data:/data
    # In production this service is private and creates a fresh restricted sandbox per job.
volumes:
  rxv-data:
